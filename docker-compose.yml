services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: lucasbank
      POSTGRES_PASSWORD: lucasbank
      POSTGRES_DB: lucasbank
    ports:
      - "5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lucasbank"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lucasbank:lucasbank@postgres/lucasbank
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres-data:
